<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UVGHelp — Servicios</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('uvghelp_theme') || 'dark')</script>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/modal.css" />
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <a class="sidebar-brand" href="dashboard.html">
      <span class="sidebar-brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span class="sidebar-brand-text">UVG<span class="accent">Help</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a>
      <a class="nav-item" href="lugares.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>Lugares</a>
      <a class="nav-item" href="eventos.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Eventos</a>
      <a class="nav-item active" href="servicios.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg></span>Servicios</a>
      <hr class="sidebar-divider" />
      <a class="nav-item" href="carreras.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>Carreras</a>
      <a class="nav-item" href="cursos.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Cursos</a>
      <a class="nav-item" href="profesores.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Profesores</a>
      <hr class="sidebar-divider" />
      <a class="nav-item" href="pagos.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span>Pagos</a>
      <a class="nav-item" href="contactos.html"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>Contactos</a>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-header">
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema"><span id="theme-icon"></span></button>
        <div class="user-block">
          <div class="user-text">
            <span class="user-name" id="header-user-name">—</span>
            <button class="user-logout" id="header-logout">Cerrar sesión</button>
          </div>
          <div class="avatar" id="header-avatar">—</div>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="crumb"><a href="dashboard.html">Dashboard</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg><span class="current">Servicios</span></div>
      <div class="page-head">
        <h1 class="page-title">Servicios</h1>
        <div class="page-actions">
          <button class="btn btn-secondary" id="btn-csv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> CSV</button>
          <button class="btn btn-secondary" id="btn-xlsx"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Excel</button>
          <button class="btn btn-primary" id="btn-nuevo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo Servicio
          </button>
        </div>
      </div>

      <div class="surface">
        <div class="filter-bar">
          <div class="search">
            <span class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="search" placeholder="Buscar servicio…" />
          </div>
        </div>
        <div class="table-wrap">
          <table class="table" id="servicios-table"><thead></thead><tbody></tbody></table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- modal crear / editar -->
<div id="servicio-modal" class="modal">
  <div class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Nuevo Servicio</h3>
        <button class="icon-btn" data-modal-close="servicio-modal" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="servicio-form">
        <div class="modal-body">
          <div class="field">
            <label class="field-label" for="f-nombre">Nombre <span class="required">*</span></label>
            <input class="field-input" type="text" id="f-nombre" name="nombre" required placeholder="Ej. Biblioteca Virtual" />
          </div>
          <div class="field">
            <label class="field-label" for="f-descripcion">Descripción</label>
            <textarea class="field-input" id="f-descripcion" name="descripcion" rows="3" placeholder="Descripción del servicio…"></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="field">
              <label class="field-label" for="f-categoria">Categoría</label>
              <input class="field-input" type="text" id="f-categoria" name="categoria" placeholder="Ej. Académico" />
            </div>
            <div class="field">
              <label class="field-label" for="f-horario">Horario</label>
              <input class="field-input" type="text" id="f-horario" name="horario" placeholder="Ej. Lun–Vie 8:00–17:00" />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="f-contacto">Contacto responsable</label>
            <select class="field-input" id="f-contacto" name="contacto_id">
              <option value="">Sin contacto asignado</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close="servicio-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="../js/pages/servicios.js"></script>
<script>
  (function () {
    var KEY = 'uvghelp_theme';
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(KEY, t);
      var icon = document.getElementById('theme-icon');
      if (icon) icon.innerHTML = t === 'dark'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }
    applyTheme(localStorage.getItem(KEY) || 'dark');
    document.getElementById('theme-toggle').addEventListener('click', function () {
      applyTheme(localStorage.getItem(KEY) === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
</body>
</html>
